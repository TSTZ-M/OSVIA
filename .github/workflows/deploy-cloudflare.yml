name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      working_directory:
        description: 'Worker directory (relative to repo root)'
        required: false
        default: 'cloudflare/osvia-web'
      wrangler_command:
        description: 'Wrangler command (e.g. deploy, d1 create OSVIA, kv namespace create OSVIA)'
        required: false
        default: 'deploy'
      ai_bench:
        description: 'bench models'
        required: false
        type: boolean
        default: false
      browser_check:
        description: 'Run real-browser check against the live site'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'cloudflare/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Run Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d80f55f5a83fab6dda4ef1e778caa012
          WORKING_DIR: ${{ inputs.working_directory || 'cloudflare/osvia-web' }}
          WRANGLER_CMD: ${{ inputs.wrangler_command || 'deploy' }}
          BENCH_VAR: ${{ inputs.ai_bench && format('--var BENCH_TOKEN:{0}', secrets.BENCH_TOKEN) || '' }}
        run: |
          if [ -n "$WORKING_DIR" ] && [ -d "$WORKING_DIR" ]; then cd "$WORKING_DIR"; fi
          if [ -f package.json ]; then npm install --no-audit --no-fund; fi
          wrangler ${WRANGLER_CMD:-deploy} ${BENCH_VAR}
      - name: AI bench
        if: ${{ inputs.ai_bench == true }}
        env:
          BENCH_TOKEN: ${{ secrets.BENCH_TOKEN }}
        run: sleep 10 && node cloudflare/osvia-web/test/ai-bench.mjs
      - name: Smoke test
        if: ${{ (inputs.wrangler_command || 'deploy') == 'deploy' }}
        run: |
          if [ -f cloudflare/osvia-web/test/smoke.mjs ]; then
            sleep 8
            node cloudflare/osvia-web/test/smoke.mjs https://osvia.tstzrm.workers.dev
            node cloudflare/osvia-web/test/smoke2.mjs https://osvia.tstzrm.workers.dev
          fi
      - name: Browser check
        if: ${{ inputs.browser_check == true }}
        run: |
          cd cloudflare/osvia-web
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node test/browser.mjs https://osvia.tstzrm.workers.dev
