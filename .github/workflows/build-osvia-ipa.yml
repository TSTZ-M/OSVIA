name: OSVIA

# Manual only: run from Actions tab -> OSVIA -> Run workflow.
# Produces an UNSIGNED OSVIA.ipa for SideStore to sign on device.
# It publishes release OSVIA-latest with the unsigned IPA, for the SideStore mirror.
# Free Apple ID signing cannot happen in the cloud; SideStore signs the
# unsigned IPA on the phone, the same way TSTZ-M's cloud IPA works.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEW=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEW" ]; then sudo xcode-select -s "$NEW/Contents/Developer"; fi
          xcodebuild -version

      - name: Make app icon
        run: swift tools/make_icon.swift Sources/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release (no signing)
        run: |
          set -o pipefail
          xcodebuild -project OSVIA.xcodeproj -scheme OSVIA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO ENABLE_PREVIEWS=NO -derivedDataPath derivedData build

      - name: Package unsigned IPA for SideStore
        run: |
          APP=derivedData/Build/Products/Release-iphoneos/OSVIA.app
          test -d "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "$BID"
          test "$BID" = "com.Hao-Yi-Miao.TSTZ-Agent"
          if find "$APP" \( -name '*.dylib' -o -name '*.appex' \) | grep -q .; then
            echo "ERROR: dylib or appex inside app"; find "$APP" \( -name '*.dylib' -o -name '*.appex' \); exit 1
          fi
          rm -rf Payload OSVIA.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OSVIA.ipa Payload
          unzip -tq OSVIA.ipa
          unzip -l OSVIA.ipa | tail -1

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSVIA-ipa
          path: ios/OSVIA.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish release OSVIA-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create OSVIA-latest OSVIA.ipa --title "OSVIA-latest" --notes "Unsigned OSVIA.ipa for SideStore" || gh release upload OSVIA-latest OSVIA.ipa --clobber

      - name: Update OSVIA-source.json from the real IPA
        run: bash tools/make-osvia-source.sh OSVIA.ipa

      - name: Commit OSVIA-source.json
        working-directory: .
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add OSVIA-source.json
          git diff --cached --quiet || (git commit -m "ci: update OSVIA-source.json" && git pull --rebase --autostash origin main && git push)
