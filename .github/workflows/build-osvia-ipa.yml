name: OSVIA

# Manual only: run from Actions tab -> OSVIA -> Run workflow.
# Produces an UNSIGNED OSVIA.ipa for SideStore to sign on device.
# It publishes release OSVIA-latest with the unsigned IPA, for the SideStore mirror.
# Free Apple ID signing cannot happen in the cloud; SideStore signs the
# unsigned IPA on the phone, the same way TSTZ-M's cloud IPA works.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          NEW=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEW" ]; then sudo xcode-select -s "$NEW/Contents/Developer"; fi
          xcodebuild -version

      - name: Make app icon
        run: swift tools/make_icon.swift Sources/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release (no signing)
        run: |
          set -o pipefail
          # 每次构建版本号都不同（0.9.<运行序号>，build=运行序号），SideStore 的源据此判断有更新
          BASE=$(sed -n 's/.*MARKETING_VERSION: "\([0-9.]*\)".*/\1/p' project.yml | head -1)
          BASE=${BASE:-0.9}
          N=${{ github.run_number }}
          VER="$BASE"
          echo "version $VER.$N build $N"
          xcodebuild -project OSVIA.xcodeproj -scheme OSVIA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO OSVIA_ID_SUFFIX= MARKETING_VERSION="$VER.$N" CURRENT_PROJECT_VERSION="$N" ENABLE_DEBUG_DYLIB=NO ENABLE_PREVIEWS=NO -derivedDataPath derivedData build

      - name: Package unsigned IPA for SideStore
        run: |
          APP=derivedData/Build/Products/Release-iphoneos/OSVIA.app
          test -d "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "$BID"
          test "$BID" = "com.Hao-Yi-Miao.TSTZ-Agent"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = "${{ github.run_number }}"
          EXT=$(find "$APP/PlugIns" -name Info.plist -maxdepth 2 | head -1)
          if [ -n "$EXT" ]; then test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$EXT")" = "com.Hao-Yi-Miao.TSTZ-Agent.Live"; fi
          if find "$APP" -name '*.dylib' | grep -q .; then
            echo "ERROR: dylib inside app"; find "$APP" -name '*.dylib'; exit 1
          fi
          rm -rf Payload OSVIA.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OSVIA.ipa Payload
          unzip -tq OSVIA.ipa
          unzip -l OSVIA.ipa | tail -1

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSVIA-ipa
          path: ios/OSVIA.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish releases (one per build + OSVIA-latest)
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          # 每个版本一个独立 Release：源里的下载地址指向该版本，SideStore 缓存了旧源也不会出现「版本号不匹配」
          gh release create "OSVIA-$N" OSVIA.ipa --title "OSVIA build $N" --notes "Unsigned OSVIA.ipa (build $N) for SideStore" --latest=false || gh release upload "OSVIA-$N" OSVIA.ipa --clobber
          # OSVIA-latest 保留给旧链接
          gh release create OSVIA-latest OSVIA.ipa --title "OSVIA-latest" --notes "Unsigned OSVIA.ipa for SideStore" || gh release upload OSVIA-latest OSVIA.ipa --clobber
          # 只保留最近 5 个版本
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' | grep -E '^OSVIA-[0-9]+$' | sort -t- -k2 -n -r | tail -n +6 | while read -r t; do gh release delete "$t" --cleanup-tag -y || true; done

      - name: Update OSVIA-source.json from the real IPA
        run: bash tools/make-osvia-source.sh OSVIA.ipa

      - name: Commit OSVIA-source.json
        working-directory: .
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add OSVIA-source.json
          git diff --cached --quiet || (git commit -m "ci: update OSVIA-source.json" && git pull --rebase --autostash origin main && git push)
