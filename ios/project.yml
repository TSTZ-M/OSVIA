name: OSVIA
options:
  bundleIdPrefix: com.Hao-Yi-Miao
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.5
targets:
  OSVIA:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/OSVIA.xcconfig
      Release: Config/OSVIA.xcconfig
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-Agent$(OSVIA_ID_SUFFIX)
        PRODUCT_NAME: OSVIA
        MARKETING_VERSION: "0.9"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: OSVIA
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.Hao-Yi-Miao.TSTZ-Agent
            CFBundleURLSchemes:
              - osvia
        LSApplicationQueriesSchemes:
          - shortcuts
          - scriptable
        NSMicrophoneUsageDescription: 语音输入需要使用麦克风
        NSSpeechRecognitionUsageDescription: 语音输入需要语音识别
        NSCameraUsageDescription: 拍照后让助理识别文字或转换格式
        NSPhotoLibraryUsageDescription: 读取你的相册，选择照片发给助理识别文字或转换格式，并在今日回顾里统计今天的照片
        NSPhotoLibraryAddUsageDescription: 保存处理后的图片和视频到相册
        NSCalendarsFullAccessUsageDescription: 助理需要为你添加和回顾日程
        NSRemindersFullAccessUsageDescription: 助理需要为你添加和回顾提醒事项
        NSAlarmKitUsageDescription: 助理需要为你设置闹钟
