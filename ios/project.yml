name: OSVIA
options:
  bundleIdPrefix: com.Hao-Yi-Miao
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_DEBUG_DYLIB: NO
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.5
targets:
  OSVIA:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/OSVIA.xcconfig
      Release: Config/OSVIA.xcconfig
    sources:
      - path: Sources
      - path: Shared
      - path: Config/PrivacyInfo.xcprivacy
    dependencies:
      - target: OSVIALive
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-Agent$(OSVIA_ID_SUFFIX)
        PRODUCT_NAME: OSVIA
        MARKETING_VERSION: "0.9"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: OSVIA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.Hao-Yi-Miao.TSTZ-Agent.mail
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: 文件
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - com.adobe.pdf
              - public.movie
              - public.audio
              - public.text
              - public.data
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.Hao-Yi-Miao.TSTZ-Agent
            CFBundleURLSchemes:
              - osvia
        LSApplicationQueriesSchemes:
          - shortcuts
          - scriptable
          - weixin
          - alipay
          - taobao
          - openapp.jdmobile
          - pinduoduo
          - imeituan
          - eleme
          - snssdk1128
          - sinaweibo
          - xhsdiscover
          - bilibili
          - mqq
          - iosamap
          - baidumap
          - orpheus
          - qqmusic
          - zhihu
          - diditaxi
          - dingtalk
          - lark
          - wxwork
          - obsidian
          - notion
          - bear
          - things
          - pages
          - numbers
          - keynote
          - ms-word
          - ms-excel
          - tg
          - whatsapp
          - chatgpt
          - googlegmail
          - ms-outlook
          - spotify
          - youtube
          - comgooglemaps
        NSLocationWhenInUseUsageDescription: 助理需要你的位置来回答附近、本地天气和路线相关的问题（只在你提问时使用）
        NSContactsUsageDescription: 助理在你要求时查询联系人的电话和邮箱（每次都会先征求你的同意）
        NSMicrophoneUsageDescription: 语音输入需要使用麦克风
        NSSpeechRecognitionUsageDescription: 语音输入需要语音识别
        NSCameraUsageDescription: 拍照后让助理识别文字或转换格式
        NSPhotoLibraryUsageDescription: 读取你的相册，选择照片发给助理识别文字或转换格式，并在今日回顾里统计今天的照片
        NSPhotoLibraryAddUsageDescription: 保存处理后的图片和视频到相册
        NSCalendarsFullAccessUsageDescription: 助理需要为你添加和回顾日程
        NSRemindersFullAccessUsageDescription: 助理需要为你添加和回顾提醒事项
        NSAlarmKitUsageDescription: 助理需要为你设置闹钟
  OSVIALive:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/OSVIA.xcconfig
      Release: Config/OSVIA.xcconfig
    sources:
      - path: Live
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-Agent$(OSVIA_ID_SUFFIX).Live
        PRODUCT_NAME: OSVIALive
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.9"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Config/LiveInfo.plist
      properties:
        CFBundleDisplayName: OSVIA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  OSVIA:
    build:
      targets:
        OSVIA: all
    run:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
