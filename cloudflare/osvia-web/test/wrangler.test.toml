name = "osvia-test"
main = "entry.js"
compatibility_date = "2026-11-13"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "OSVIA"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "R2"
bucket_name = "osvia"
